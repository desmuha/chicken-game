<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cash Out Now</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.5em;
      color: #00ff88;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3em;
      margin: 15px 0;
    }

    .btn {
      background-color: #00ff88;
      color: #000;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 30px;
      font-weight: bold;
      box-shadow: 0 0 10px #00ff88;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #00cc6a;
    }
  </style>
</head>
<body>
  <h1>🎉 Congratulations!</h1>
  <p>You’ve won <strong>$<span id="amount">??</span></strong></p>
  <p>Click below to cash out your earnings.</p>
  <button class="btn" onclick="window.location.href='pay.html'">💵 Cash Out</button>

  <script>
    // لو بدك تبعت قيمة المبلغ من الصفحة السابقة، لازم تحفظها بـ localStorage
    const amount = localStorage.getItem('amount') || '???';
    document.getElementById('amount').textContent = amount;
  </script>
</body>
</html>
