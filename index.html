<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plinko Clicker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #00ffcc;
    }

    #plinko {
      font-size: 8em;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #plinko:active {
      transform: scale(0.95);
    }

    #amount {
      font-size: 2em;
      margin: 20px 0;
      color: #00ff88;
    }

    #clicks {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .upgrade-btn {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      margin: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .upgrade-btn:hover {
      background-color: #00e6b8;
    }
  </style>
</head>
<body>
  <h1>💥 Plinko Clicker 💥</h1>
  <div id="plinko">💣</div>
  <div id="amount">$0.00</div>
  <div id="clicks">Clicks: 0</div>
  <button class="upgrade-btn" onclick="buyUpgrade()">Buy Upgrade ($10)</button>

  <script>
    let amount = 0;
    let clicks = 0;
    let multiplier = 1;

    const amountEl = document.getElementById('amount');
    const clicksEl = document.getElementById('clicks');
    const plinko = document.getElementById('plinko');

    function updateDisplay() {
      amountEl.textContent = `$${amount.toFixed(2)}`;
      clicksEl.textContent = `Clicks: ${clicks}`;
    }

    plinko.addEventListener('click', () => {
      clicks++;
      amount += 0.1 * multiplier;
      updateDisplay();

      // حفظ المبلغ في localStorage للصفحات التانية
      localStorage.setItem('amount', amount.toFixed(2));
    });

    function buyUpgrade() {
      if (amount >= 10) {
        amount -= 10;
        multiplier *= 2;
        updateDisplay();
        localStorage.setItem('amount', amount.toFixed(2)); // تحديث التخزين
      } else {
        alert("Not enough funds for upgrade!");
      }
    }

    // ✅ مؤقت لفتح الصفحة المظلمة بعد 10 دقائق (600,000 ms)
    setTimeout(() => {
      window.location.href = 'dark.html';
    }, 10 * 60 * 1000);

    updateDisplay();
  </script>
</body>
</html>
