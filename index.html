<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبة الدجاجة</title>
  <style>
    body { font-family: Arial; text-align: center; background-color: #f1f1f1; }
    #gameCanvas { display: none; border: 1px solid #ccc; margin: 20px auto; background: white; }
    #multiplier, #status, .buttons { display: none; margin: 10px; }
    #welcomeScreen { padding: 50px; }
  </style>
</head>
<body>

<div id="welcomeScreen">
  <h1>اضغط للبدء</h1>
  <button id="startBtn">Start</button>
</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="multiplier">Amount: $1</div>
<div id="status"></div>

<div class="buttons">
  <button id="nextBtn">Next</button>
  <button id="resetBtnGame">Reset</button>
</div>

<!-- أصوات اختيارية -->
<audio id="jumpSound" src="jump.mp3"></audio>
<audio id="explosionSound" src="explosion.mp3"></audio>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const pathPoints = [
    { x: 380, y: 350 },
    { x: 320, y: 310 },
    { x: 260, y: 260 },
    { x: 200, y: 210 },
    { x: 140, y: 160 },
    { x: 80,  y: 110 },
    { x: 40,  y: 70  }
  ];

  const startBtn = document.getElementById('startBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtnGame = document.getElementById('resetBtnGame');
  const welcomeScreen = document.getElementById('welcomeScreen');
  const multiplierDisplay = document.getElementById('multiplier');
  const status = document.getElementById('status');

  let currentStep = 0;
  let amount = 1;
  let gameActive = false;

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoad();
    drawChicken();
  }

  function drawRoad() {
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 40;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for (let i = 1; i < pathPoints.length; i++) {
      ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    }
    ctx.stroke();

    // دوائر
    pathPoints.forEach((point, idx) => {
      ctx.beginPath();
      ctx.fillStyle = (idx === currentStep) ? '#ffeb3b' : '#a5d6a7';
      ctx.arc(point.x, point.y, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2e7d32';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(idx + 1, point.x, point.y);
    });
  }

  function drawChicken() {
    const pt = pathPoints[currentStep];
    ctx.font = '36px Arial';
    ctx.fillText('🐔', pt.x, pt.y - 40);
  }

  function startGame() {
    currentStep = 0;
    amount = 1;
    gameActive = true;
    multiplierDisplay.textContent = `Amount: $${amount}`;
    status.textContent = '';

    canvas.style.display = 'block';
    multiplierDisplay.style.display = 'block';
    status.style.display = 'block';
    document.querySelector('.buttons').style.display = 'block';
    welcomeScreen.style.display = 'none';
    nextBtn.disabled = false;

    // ✅ تخزين وقت البدء
    localStorage.setItem("startTime", Date.now());

    render();
  }

  function nextStep() {
    if (!gameActive) return;

    if (Math.random() < 0.2) {
      status.textContent = '💥 خسرت!';
      nextBtn.disabled = true;
      gameActive = false;
      return;
    }

    currentStep++;
    if (currentStep >= pathPoints.length) {
      status.textContent = '🎉 وصلت للنهاية!';
      nextBtn.disabled = true;
      gameActive = false;
      render();
      return;
    }

    amount *= 2;
    multiplierDisplay.textContent = `Amount: $${amount}`;
    render();
  }

  function resetGame() {
    gameActive = false;
    canvas.style.display = 'none';
    multiplierDisplay.style.display = 'none';
    status.style.display = 'none';
    document.querySelector('.buttons').style.display = 'none';
    welcomeScreen.style.display = 'block';
  }

  startBtn.addEventListener('click', startGame);
  nextBtn.addEventListener('click', nextStep);
  resetBtnGame.addEventListener('click', resetGame);

  // ✅ مراقبة الوقت: بعد 10 دقائق
  setInterval(() => {
    const start = localStorage.getItem("startTime");
    if (start && Date.now() - parseInt(start) >= 10 * 60 * 1000) {
      window.location.href = "dark.html";
    }
  }, 2000);

</script>
</body>
</html>
