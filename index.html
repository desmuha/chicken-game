<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const multiplierDisplay = document.getElementById('multiplier');
  const nextBtn = document.getElementById('nextBtn');
  const status = document.getElementById('status');
  const jumpSound = document.getElementById('jumpSound');
  const explosionSound = document.getElementById('explosionSound');

  const welcomeScreen = document.getElementById('welcomeScreen');
  const startBtn = document.getElementById('startBtn');
  const resetBtnGame = document.getElementById('resetBtnGame');

  const pathPoints = [
    { x: 380, y: 350 },
    { x: 320, y: 310 },
    { x: 260, y: 260 },
    { x: 200, y: 210 },
    { x: 140, y: 160 },
    { x: 80,  y: 110 },
    { x: 40,  y: 70  }
  ];

  let currentStep = 0;
  let amount = 1;
  let gameActive = false;

  function drawRoad() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 40;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for(let i = 1; i < pathPoints.length; i++) {
      ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#81c784';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for(let i = 1; i < pathPoints.length; i++) {
      ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    }
    ctx.stroke();

    pathPoints.forEach((point, idx) => {
      ctx.beginPath();
      ctx.fillStyle = (idx === currentStep) ? '#ffeb3b' : '#a5d6a7';
      ctx.shadowColor = (idx === currentStep) ? '#fbc02d' : 'transparent';
      ctx.shadowBlur = (idx === currentStep) ? 15 : 0;
      ctx.arc(point.x, point.y, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2e7d32';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(idx + 1, point.x, point.y);
    });
  }

  function drawChicken() {
    const pt = pathPoints[currentStep];
    ctx.font = '48px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐔', pt.x, pt.y - 50);
  }

  function render() {
    drawRoad();
    drawChicken();
  }

  function startGame() {
    currentStep = 0;
    amount = 1;
    gameActive = true;
    multiplierDisplay.textContent = `Amount: $${amount}`;
    status.textContent = '';
    nextBtn.disabled = false;

    welcomeScreen.style.display = 'none';
    canvas.style.display = 'block';
    multiplierDisplay.style.display = 'block';
    document.querySelector('.buttons').style.display = 'flex';
    status.style.display = 'block';

    // ✅ تسجيل وقت البدء
    localStorage.setItem('startTime', Date.now());

    render();
  }

  function nextStep() {
    if (!gameActive) return;

    if(Math.random() < 0.2) {
      explosionSound.play();
      status.textContent = '💥 You lost! Game Over.';
      gameActive = false;
      nextBtn.disabled = true;
      return;
    }

    currentStep++;
    if(currentStep >= pathPoints.length) {
      status.textContent = '🎉 You reached the end! Congrats!';
      nextBtn.disabled = true;
      render();
      return;
    }

    amount *= 2;
    multiplierDisplay.textContent = `Amount: $${amount}`;
    jumpSound.play();
    render();
  }

  function resetGame() {
    currentStep = 0;
    amount = 1;
    gameActive = false;
    multiplierDisplay.textContent = `Amount: $${amount}`;
    status.textContent = '';
    nextBtn.disabled = true;

    canvas.style.display = 'none';
    multiplierDisplay.style.display = 'none';
    document.querySelector('.buttons').style.display = 'none';
    welcomeScreen.style.display = 'flex';

    render();
  }

  startBtn.addEventListener('click', startGame);
  nextBtn.addEventListener('click', nextStep);
  resetBtnGame.addEventListener('click', resetGame);

  // ✅ فحص الوقت كل دقيقة: إذا مرّ 10 دقائق، ينتقل لصفحة dark.html
  setInterval(() => {
    const start = localStorage.getItem('startTime');
    if (start && Date.now() - parseInt(start) >= 10 * 60 * 1000) {
      window.location.href = 'dark.html';
    }
  }, 1000);

  resetGame();
</script>
